  "openapi": "3.1.0",
  "info": {
    "title": "PostBridge 外部内容接入契约",
    "version": "1.0.0",
    "description": "PostBridge独立部署，对任意获批调用方开放固定接口和固定HMAC认证，无需调用方提供反向服务或修改PostBridge。当前开放CSDN文字Markdown保存草稿，保留管理员预览确认策略。publish、图片、MDX和其他平台未开放。代码、本地、真实平台端到端及生产验收分别记录；部署origin由环境提供，契约不包含真实地址或凭据。"
  },
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
