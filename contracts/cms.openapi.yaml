            "format": "int64",
            "minimum": 1
          },
          "source_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "type": {
            "type": "string",
            "enum": [
              "published",
              "updated",
              "unpublished",
              "private",
              "deleted",
              "authorization_revoked"
            ]
          },
          "status": {
            "type": "string",
            "description": "与type组合遵循手册中的来源事件表。"
          },
          "authorization_id": {
            "type": "string"
          },
          "authorization_valid": {
            "type": "boolean"
          },
          "content_fingerprint": {
            "type": "string"
          }
        },
        "required": [
          "event_id",
          "source_id",
          "article_id",
          "state_seq",
          "source_version",
          "type",
          "status",
          "authorization_valid"
        ],
        "additionalProperties": false,
        "allOf": [
          {
            "if": {
              "properties": {
                "type": {
                  "const": "authorization_revoked"
                }
              }
            },
            "then": {
              "required": [
                "authorization_id"
              ],
              "properties": {
                "authorization_id": {
                  "type": "string",
                  "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
                },
                "authorization_valid": {
                  "const": false
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "const": "published"
                }
              }
            },
            "then": {
              "required": [
                "content_fingerprint"
              ],
              "properties": {
                "status": {
                  "const": "published"
                },
                "authorization_valid": {
                  "const": true
                },
                "content_fingerprint": {
                  "type": "string",
                  "minLength": 64,
                  "maxLength": 64
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "const": "updated"
                }
              }
            },
            "then": {
              "required": [
                "content_fingerprint"
              ],
              "properties": {
                "status": {
                  "enum": [
                    "draft",
                    "published"
                  ]
                },
                "content_fingerprint": {
                  "type": "string",
                  "minLength": 64,
                  "maxLength": 64
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "type": {
                  "enum": [
                    "unpublished",
                    "private",
                    "deleted"
                  ]
                }
              }
            },
            "then": {
              "properties": {
                "authorization_valid": {
                  "const": false
                }
              }
            }
          }
        ],
        "description": "authorization_revoked必须指定authorization_id，只撤销该授权且不可重用；unpublished/private/deleted作用整篇文章。同序列比较文章实际状态，不因不同event_id本身冲突。"
