name: 全量验证

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: post_bridge_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: post_bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U post_bridge_ci -d post_bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://post_bridge_ci:local-ci-only@127.0.0.1:5432/post_bridge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: 固定 npm 版本
        run: npm install --global npm@10.9.4
      - name: 安装固定依赖
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Python 格式化工具
        run: python3 -m pip install black==25.1.0
      - name: 准备数据库行权限与账号隔离工具
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python3 scripts/ci_database.py
      - name: 代码格式检查
        run: npm run format:check
      - name: npm 依赖安全检查
        run: npm audit --registry=https://registry.npmjs.org
      - name: Go 依赖调用路径安全检查
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: 安装匹配的 Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Go 并发与真实数据库验证
        working-directory: apps/api
        run: go test -race ./...
      - name: Go 静态检查
        working-directory: apps/api
        run: go vet ./...
      - name: Shell 入口语法检查
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: 运行入口安全用例
        run: python3 -m unittest discover -s tests/runtime -v
      - name: Ubuntu 独立 systemd 生命周期验证
        run: sudo python3 scripts/ubuntu_systemd_smoke.py --system
      - name: 登录助手停止用例
        run: node --test tests/runtime/login-session.test.mjs
      - name: 构建
        run: npm run build
      - name: 工作区用例
        run: npm test
      - name: 类型检查
        run: npm run typecheck
      - name: 端到端设施类型检查
        run: npx --no-install tsc -p tests/e2e/tsconfig.json
      - name: 从 Ubuntu 安装快照构建
        run: |
          python3 -B - <<'PY'
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from scripts.ubuntu_deploy import REPO, copy_source

          with TemporaryDirectory(prefix='post-bridge-snapshot-') as temp:
              release = Path(temp) / 'release'
              copy_source(REPO, release)
              subprocess.run(['npm', 'ci', '--no-audit', '--no-fund'], cwd=release, check=True)
              subprocess.run(['npm', 'run', 'build'], cwd=release, check=True)
              subprocess.run(['go', 'build', '-o', release / 'post-bridge-api', './cmd/server'],
                             cwd=release / 'apps/api', check=True)
          PY
      - name: 后台与真实 API 端到端验证
        run: npm run test:e2e
      - name: 保存合成数据截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 合成后台截图
          path: test-results/e2e/**/*.png
          if-no-files-found: ignore
          retention-days: 7
